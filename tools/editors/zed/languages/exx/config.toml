name = "EXX"
grammar = "exx"
path_suffixes = ["exx"]
line_comments = ["// "]
block_comment = ["/*", "*/"]

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
]
